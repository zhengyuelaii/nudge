name: nudge

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    image: nudge-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      DB_PATH: /data/nudge.db
      NUDGE_SCHEDULER: "on"
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
    expose:
      - "8787"

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: nudge-web:latest
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./auth.caddyfile:/etc/caddy/auth.caddyfile:ro
